version: "3.9"

services:

  web:
    build: .

    ports:
      - "8001:8000"

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aastha
      POSTGRES_DB: chatdb

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
