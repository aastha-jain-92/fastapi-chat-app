<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProChat | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-light: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 20px;
            min-height: 20px;
            padding: 10px;
            border-radius: 6px;
        }

        .msg-success {
            background-color: #ecfdf5;
            color: var(--success-green);
        }

        .msg-error {
            background-color: #fef2f2;
            color: var(--error-red);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join the ProChat community today</p>
    </div>

    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a unique name" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters">
    </div>

    <button id="regBtn" onclick="registerUser()">Sign Up</button>

    <p id="msg"></p>

    <div class="login-link">
        Already have an account? <a href="/login">Log in</a>
    </div>
</div>

<script>
    async function registerUser() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const msgEl = document.getElementById("msg");
        const btn = document.getElementById("regBtn");

        // Reset UI state
        msgEl.className = "";
        msgEl.innerText = "";
        
        if (!username || !password) {
            msgEl.innerText = "Please fill in all fields.";
            msgEl.classList.add("msg-error");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Creating account...";

        try {
            const res = await fetch("/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await res.json();
            msgEl.innerText = data.message || (res.ok ? "Account created!" : "Registration failed.");

            if (res.ok) {
                msgEl.classList.add("msg-success");
                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);
            } else {
                msgEl.classList.add("msg-error");
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        } catch (err) {
            msgEl.innerText = "Server error. Please try again later.";
            msgEl.classList.add("msg-error");
            btn.disabled = false;
            btn.innerText = "Sign Up";
        }
    }

    // Enter key support
    document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") registerUser();
    });
</script>

</body>
</html>
