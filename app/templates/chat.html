<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProChat | Secure Messaging</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-light: #f3f4f6;
            --sent-msg: #6366f1;
            --received-msg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Container */
        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: #fff;
            display: flex;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Sidebar (User selection) */
        .sidebar {
            width: 300px;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: 600;
            font-size: 1.2rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .user-input-wrapper {
            padding: 15px;
        }

        #to {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        #to:focus {
            border-color: var(--primary-color);
        }

        /* Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Subtle pattern */
            display: flex;
            flex-direction: column;
        }

        /* Message Bubbles */
        .message {
            max-width: 70%;
            margin-bottom: 12px;
            padding: 10px 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .sent {
            align-self: flex-end;
            background-color: var(--sent-msg);
            color: white;
            border-radius: 18px 18px 0 18px;
        }

        .received {
            align-self: flex-start;
            background-color: var(--received-msg);
            color: var(--text-main);
            border: 1px solid #e5e7eb;
            border-radius: 18px 18px 18px 0;
        }

        /* Typing Indicator */
        #typing {
            padding: 5px 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            height: 20px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
        }

        #msg {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Scrollbar styling */
        #messages::-webkit-scrollbar {
            width: 6px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <aside class="sidebar">
        <div class="sidebar-header">Messages</div>
        <div class="user-input-wrapper">
            <label style="font-size: 0.8rem; color: var(--text-muted);">CHAT WITH</label>
            <input id="to" placeholder="Username..." autocomplete="off">
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-header">
            <div id="active-user-display" style="font-weight: 600;">Select a user</div>
            <div style="font-size: 0.8rem; color: #10b981;">● Online</div>
        </div>

        <ul id="messages">
            </ul>

        <div id="typing"></div>

        <div class="input-area">
            <input id="msg" placeholder="Write a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </main>
</div>

<script>
    const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
    const messageList = document.getElementById("messages");

    // UI Logic: Update header when typing "To"
    document.getElementById("to").addEventListener("input", (e) => {
        document.getElementById("active-user-display").textContent = e.target.value || "Select a user";
    });

    document.getElementById("to").addEventListener("keydown", function(e) {
        if (e.key === "Enter") loadHistory();
    });

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.type === "error") {
            const userConfirmed = alert(data.message);
            window.location.href = "/register";
            return;
        }

        if (data.type === "typing") {
            showTypingIndicator(data.sender);
            return;
        }
        hideTypingIndicator();

        appendMessage(data);
    };

    async function appendMessage(data) {
        const li = document.createElement("li");
        const currentUser = await getCurrentUser();
        
        li.classList.add("message");
        
        if (data.sender === currentUser) {
            li.classList.add("sent");
            li.textContent = data.message || data.content;
        } else {
            li.classList.add("received");
            li.textContent = data.message || data.content;
        }

        messageList.appendChild(li);
        messageList.scrollTop = messageList.scrollHeight; // Auto-scroll
    }

    document.getElementById("msg").addEventListener("input", function () {
        const to = document.getElementById("to").value;
        if (!to) return;

        socket.send(JSON.stringify({
            type: "typing",
            to: to,
            sender: getCurrentUser()
        }));
    });

    function showTypingIndicator(user) {
        const el = document.getElementById("typing");
        el.innerText = `${user} is typing...`;
    }

    function hideTypingIndicator() {
        document.getElementById("typing").innerText = "";
    }

    function sendMessage() {
        const to = document.getElementById("to").value;
        const msgInput = document.getElementById("msg");
        const msg = msgInput.value;
        console.log("Sending:", { to, msg });
        if(!msg) return;

        socket.send(JSON.stringify({
            type: "message",
            to: to,
            message: msg
        }));
        
        // Optimistically add message to UI or wait for socket return
        msgInput.value = "";
    }

    async function getCurrentUser(){

    try{
        const res = await fetch("/me", {
            credentials:"include"
        });

        if(!res.ok) return null;

        const data = await res.json();

        return data.username;

    }catch(err){
        return null;
    }
}


    async function loadHistory() {
        const currentUser = await getCurrentUser();
        const receiver = document.getElementById("to").value;
        if (!currentUser || !receiver) return;

        const res = await fetch(`/messages/${currentUser}/${receiver}`);
        const messages = await res.json();

        messageList.innerHTML = "";
        messages.forEach(appendMessage);
    }
</script>

</body>
</html>
